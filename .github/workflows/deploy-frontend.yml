name: Deploy Main Frontend to MonsterASP

on:
  push:
    branches:
      - main
      - feature/supabase-production-config
    paths:
      - 'frontend/src/**'
      - 'frontend/angular.json'
      - 'frontend/package.json'
      - '!frontend/admin-portal/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular app
        working-directory: ./frontend
        run: npm run build -- --configuration=production

      - name: Deploy to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.MONSTERASP_FRONTEND_FTP_SERVER }}
          username: ${{ secrets.MONSTERASP_FRONTEND_FTP_USERNAME }}
          password: ${{ secrets.MONSTERASP_FRONTEND_FTP_PASSWORD }}
          local-dir: ./frontend/dist/frontend/browser/
          server-dir: /site/wwwroot/
