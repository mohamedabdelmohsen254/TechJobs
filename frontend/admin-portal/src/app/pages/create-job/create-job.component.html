<div>
  <h1 class="text-3xl font-bold text-gray-800 mb-8">Add New Job</h1>

  @if (error()) {
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
      {{ error() }}
    </div>
  }

  <form (ngSubmit)="onSubmit()" class="bg-white rounded-lg shadow p-6 max-w-2xl">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Job Title <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          [(ngModel)]="job.title"
          name="title"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="e.g., Senior Software Engineer"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Company <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          [(ngModel)]="job.company"
          name="company"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="e.g., TechCorp"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Apply URL <span class="text-red-500">*</span>
        </label>
        <input
          type="url"
          [(ngModel)]="job.applyUrl"
          name="applyUrl"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="https://example.com/apply"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Country</label>
        <input
          type="text"
          [(ngModel)]="job.country"
          name="country"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="e.g., Egypt"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
        <input
          type="text"
          [(ngModel)]="job.city"
          name="city"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="e.g., Cairo"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Location (Full)</label>
        <input
          type="text"
          [(ngModel)]="job.location"
          name="location"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="e.g., Cairo, Egypt - Remote"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Work Type</label>
        <select
          [(ngModel)]="job.workType"
          name="workType"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">Select...</option>
          <option value="Remote">Remote</option>
          <option value="Hybrid">Hybrid</option>
          <option value="Onsite">Onsite</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Salary Range</label>
        <input
          type="text"
          [(ngModel)]="job.salaryRange"
          name="salaryRange"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="e.g., $80,000 - $120,000"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tags</label>
        <input
          type="text"
          [(ngModel)]="job.tags"
          name="tags"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="e.g., react, nodejs, typescript"
        />
      </div>

      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea
          [(ngModel)]="job.description"
          name="description"
          rows="5"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Job description..."
        ></textarea>
      </div>
    </div>

    <div class="flex gap-4 mt-6">
      <button
        type="submit"
        [disabled]="isSubmitting()"
        class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg transition-colors disabled:opacity-50"
      >
        {{ isSubmitting() ? 'Creating...' : 'Create Job' }}
      </button>
      <button
        type="button"
        (click)="cancel()"
        class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-2 rounded-lg transition-colors"
      >
        Cancel
      </button>
    </div>
  </form>
</div>
